name: Build & Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Formatting (spotlessCheck)
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Build
        run: ./gradlew compileKotlinJvm

      - name: Test
        run: ./gradlew jvmTest

      - name: Coverage gate (koverVerify)
        run: ./gradlew koverVerify
